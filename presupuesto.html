    <main>
        <section>
            <h2>Solicita información</h2>
            <p>Rellena el formulario y nos pondremos en contacto contigo.</p>

            <form action="#" method="post">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre"
                       minlength="3" maxlength="20"
                       pattern="[A-Za-zÁÉÍÓÚáéíóúÜüÑñ ]{3,20}"
                       required>

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono"
                       pattern="[0-9]{9}" maxlength="9" required>

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>

                <label for="informacion">Cuéntanos qué necesitas:</label>
                <textarea id="informacion" name="informacion" rows="5"></textarea>

                <label>
                    <input type="checkbox" name="privacidad" required>
                    Acepto la política de privacidad.
                </label>

                <button type="submit">Enviar</button>
                <button type="reset">Borrar formulario</button>
            </form>
        </section>
    </main>
